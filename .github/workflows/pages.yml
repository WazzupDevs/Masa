# Public legal pages (privacy policy, KVKK notice, terms, account deletion) on GitHub Pages, built
# from docs/legal/ by `pnpm site:build`. One-time setup: repo Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/legal/**
      - scripts/build-site.ts
      - scripts/site/**
      - supabase/functions/_shared/pure/brand.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
