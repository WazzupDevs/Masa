# Ayarlar → Tasarım (test) → Bileşen önizleme: the game components that screens wire later, with
# sample props, photographed in the run's scheme. One block per set (Aşama 6, Aşama 7, Aşama 8).
appId: app.kabuk.mobile
---
- tapOn:
    id: tab-profile
- tapOn: Ayarlar
- scrollUntilVisible:
    element:
      id: preview-open
    timeout: 30000
- tapOn:
    id: preview-open
- extendedWaitUntil:
    visible:
      id: preview-games
    timeout: 10000
- takeScreenshot: 04c-preview-games-1
