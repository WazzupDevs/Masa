# T6, F1, F3: end the room, mutual Evet, "Arkadaş ekle" from both tables, DM both ways.
appId: app.masa.mobile
---
# The encounter must be at least 3 minutes old for the play history (and "Arkadaş ekle").
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: backdate-encounter
- scrollUntilVisible:
    element:
      text: Odayı bitir
    timeout: 20000
- tapOn: Odayı bitir
- extendedWaitUntil:
    visible: Tanışalım mı\?
    timeout: 15000
- takeScreenshot: 21-reveal-question
- tapOn:
    id: reveal-yes
- extendedWaitUntil:
    visible: Cevabın alındı. Sonuç birazdan.
    timeout: 10000
- takeScreenshot: 22-reveal-answered
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: reveal
      BODY: '{"yes":true}'
- extendedWaitUntil:
    visible: Ekranını kaldır, birbirinizi bulun.
    timeout: 15000
- takeScreenshot: 23-reveal-mutual
- tapOn: Arkadaş ekle
- extendedWaitUntil:
    visible: Eklendi. İkiniz de basarsanız arkadaş olursunuz.
    timeout: 10000
- takeScreenshot: 24-add-friend-done
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: add-friend
- tapOn: Mekana dön
- tapOn:
    id: tab-friends
- extendedWaitUntil:
    visible: Bot Masa
    timeout: 20000
- takeScreenshot: 25-friends
- tapOn: Bot Masa
- extendedWaitUntil:
    visible: Henüz mesaj yok. İlk mesajı sen yaz.
    timeout: 15000
- takeScreenshot: 26-dm-empty
- tapOn:
    id: dm-input
- inputText: Merhaba bot
# The composer sits under the keyboard on this screen (listed in the PR as a visual bug); the
# screenshot keeps it visible, hideKeyboard lets the flow reach the send button.
- takeScreenshot: 26b-dm-keyboard
- hideKeyboard
- tapOn:
    id: dm-send
- extendedWaitUntil:
    visible: Merhaba bot
    timeout: 10000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-last
      EXPECT_DM: Merhaba bot
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: dm-send
      BODY: '{"body":"Selam cihaz"}'
- extendedWaitUntil:
    visible: Selam cihaz
    timeout: 20000
- takeScreenshot: 27-dm
- hideKeyboard
