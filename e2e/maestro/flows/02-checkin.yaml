# V4 (and V3's refusal): pick the venue by hand, check in from 310 m (refused), then inside.
appId: app.kabuk.mobile
---
- scrollUntilVisible:
    element:
      text: E2E Kafe
    timeout: 30000
- takeScreenshot: 05-explore-list
# The map: GL layers under the header (the header and the switch stay on top), opening on the
# venues. Pins are GL, not views, so the screenshot is the check; it waits until the map has drawn
# its style, glyphs and venue layers (`explore-map-ready`).
- tapOn: Harita
- extendedWaitUntil:
    visible:
      id: explore-map-ready
    timeout: 30000
- assertVisible: Keşfet
- assertVisible: Liste
- takeScreenshot: 05b-explore-map
- tapOn: Liste
- scrollUntilVisible:
    element:
      text: E2E Kafe
    timeout: 30000
- tapOn: E2E Kafe
- extendedWaitUntil:
    visible: Buraya giriş yap
    timeout: 10000
- takeScreenshot: 06-venue-detail
- tapOn: Buraya giriş yap
- extendedWaitUntil:
    visible: Konumumu kullan
    timeout: 10000
- tapOn: Konumumun bu amaçla kullanılmasına açık rıza veriyorum.
- takeScreenshot: 07-location-consent
- setLocation:
    latitude: ${OUTSIDE_LAT}
    longitude: ${OUTSIDE_LNG}
- tapOn: Konumumu kullan
- extendedWaitUntil:
    visible: Bu mekana çok uzaktasın. Mekandayken tekrar dene.
    timeout: 30000
- takeScreenshot: 08-too-far
- setLocation:
    latitude: ${INSIDE_LAT}
    longitude: ${INSIDE_LNG}
- tapOn: Konumumu kullan
- extendedWaitUntil:
    visible: Masada kaç kişisiniz\?
    timeout: 30000
# The name comes from sign-up (docs/SPEC_V3.md §3): joining with the profile is available.
- assertNotVisible: Profille katılmak için önce Profil sekmesinden bir ad seç.
- takeScreenshot: 09-headcount
- tapOn:
    id: headcount-2
- tapOn: Masayı aç
- extendedWaitUntil:
    visible: Masan hazır
    timeout: 15000
- takeScreenshot: 10-table-ready
- tapOn: Devam
- extendedWaitUntil:
    visible: Oda kur
    timeout: 15000
- takeScreenshot: 11-venue
