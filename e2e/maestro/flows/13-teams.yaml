# Faz 2, teams (docs/SPEC_V3.md §22; step 22.6): this phone plays with two bot tables. Bot A is the
# bot server on port 8787 ("Bot İki" since 08); bot B is the second bot server, on port 8788.
# 1. "Bu masadayım" (§22.C): this phone joins bot A's side as a member; bot B joins as the other
#    side's leader. Refereed Sesli Tabu (§22.E): on bot A's turn this phone is the describer's
#    teammate and never gets the card; on bot B's turn its side judges: the card and Tabu.
# 2. Leadership (§22.D): bot A leaves; this phone leads the side now and ends the room.
# 3. This phone alone against bot A and bot B (§22.C), then the table's end (§23.G): both of the
#    other side's phones, one row each.
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane","headcount":2,"teams":true}'
- evalScript: ${output.aliasA = output.bot.alias}
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: login
      BOT_PORT: '8788'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane","headcount":2,"teams":true}'
      BOT_PORT: '8788'
- evalScript: ${output.aliasB = output.bot.alias}
# 1. Bot A opens its table to the lobby at this phone's spot: its card has "Katıl" and "Bu masadayım".
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: create-room
- tapOn:
    id: tab-venue
# Centred: at the bottom of a 320 × 640 screen the card's second button sits under the floating tab
# bar, where a tap lands on the bar.
- scrollUntilVisible:
    element:
      id: request-member
    centerElement: true
    timeout: 20000
- takeScreenshot: 59-teams-lobby
- tapOn:
    id: request-member
# The sheet scrolls: at the largest text size "İstek gönder" is below its fold.
- scrollUntilVisible:
    element:
      id: request-send
    centerElement: true
    timeout: 10000
- takeScreenshot: 60-teams-member-sheet
- tapOn:
    id: request-send
# "Liderine bu adı söyle": this phone's alias at its largest, the name bot A sees on the request.
- extendedWaitUntil:
    visible:
      id: member-pending
    timeout: 15000
- takeScreenshot: 61-teams-member-pending
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: accept-request
# On bot A's side in the lobby (docs/SPEC_V3.md §23.C): the table card says so, with "Masaya git"
# and "Masadan çık"; nothing sends the phone to the room.
- extendedWaitUntil:
    visible:
      id: leave-table
    timeout: 20000
# The phone was down at the lobby for "Bu masadayım": up to the card's status line.
- scrollUntilVisible:
    element:
      text: Lobide açık
    direction: UP
    timeout: 10000
- takeScreenshot: 61b-teams-member-card
# Centred, like "Bu masadayım": a button at the bottom sits under the tab bar or the Mekan tile.
- scrollUntilVisible:
    element:
      id: go-to-table
    centerElement: true
    timeout: 10000
- tapOn:
    id: go-to-table
# In the room as a member: the red button is "Masadan çık", not "Masayı bitir".
- extendedWaitUntil:
    visible:
      id: leave-room
    timeout: 20000
- assertNotVisible:
    id: end-room
- takeScreenshot: 62-teams-member-room
# Bot B joins as the other side's leader ("Katıl"); bot A accepts.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: request-join
      BOT_PORT: '8788'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: accept-request
# A member may propose a game (§22.E); bot B accepts.
- extendedWaitUntil:
    visible:
      id: propose-tabu
    timeout: 20000
- tapOn:
    id: propose-tabu
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: answer-game
      BOT_PORT: '8788'
# The device's first two-table Tabu in a shard without 04: its intro (§19.2).
- runFlow: tabu-intro-if-shown.yaml
# Turn 1, bot A's side: bot A starts it and so describes. This phone, its teammate, never gets the
# card; Doğru is every phone's in a refereed game.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: begin-turn
- extendedWaitUntil:
    visible:
      id: tabu-with-describer
    timeout: 20000
- assertVisible: ${output.aliasA} anlatıyor\.
- assertNotVisible:
    id: tabu-card
- assertVisible:
    id: tabu-correct
- takeScreenshot: 63-teams-teammate
- tapOn:
    id: tabu-correct
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: expire-turn
# Turn 2, bot B's side: this phone's side judges, so it sees the card, Doğru and Tabu.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: begin-turn
      BOT_PORT: '8788'
- extendedWaitUntil:
    visible:
      id: tabu-card
    timeout: 20000
- assertVisible:
    id: tabu-taboo
- takeScreenshot: 64-teams-judge
- tapOn:
    id: tabu-taboo
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-game
# 2. Bot A leaves: this phone, the side's only member, leads it now ("Artık lider sensin").
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: leave-room
- scrollUntilVisible:
    element:
      id: leader-note
    direction: UP
    timeout: 20000
- assertVisible:
    id: end-room
- takeScreenshot: 65-teams-new-leader
# docs/SPEC_V3.md §23.G: "Masayı bitir" closes the table at once for every phone, and
# this phone gets the table's end with the other side's phone it sat with.
- tapOn:
    id: end-room
- extendedWaitUntil:
    visible:
      id: table-end
    timeout: 20000
- assertVisible: ${output.aliasB}
- runFlow:
    file: table-end-close.yaml
# 3. This phone's table: bot A joins as the other side's leader, bot B as bot A's member.
- runFlow:
    file: open-lobby-accept.yaml
- extendedWaitUntil:
    visible:
      id: propose-tabu
    timeout: 15000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: request-member
      BODY: '{"side":"guest"}'
      BOT_PORT: '8788'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: accept-request
# "Masadakiler" from the room's title: the other side has two phones (overline: upper case).
- extendedWaitUntil:
    visible: 2 telefon
    timeout: 20000
- tapOn: Masadakileri gör
- extendedWaitUntil:
    visible:
      id: room-people
    timeout: 10000
- assertVisible: KARŞI TARAF · 2 TELEFON
- takeScreenshot: 66-teams-people
- back
- tapOn:
    id: end-room
# The table's end lists both phones of the other side, each with its own row (§23.G): the pair
# played for less than 3 minutes, so a row has no "Arkadaş ekle".
- extendedWaitUntil:
    visible:
      id: table-end
    timeout: 20000
- assertVisible: ${output.aliasA}
- assertVisible: ${output.aliasB}
- takeScreenshot: 67-teams-table-end
- runFlow:
    file: table-end-close.yaml
