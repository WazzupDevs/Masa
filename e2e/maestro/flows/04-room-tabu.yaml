# V7 and T1–T3: open Tabu room, the bot table asks to join, accept, one voice Tabu turn.
appId: app.masa.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: login
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
- tapOn:
    id: tab-venue
- extendedWaitUntil:
    visible: Oda kur
    timeout: 10000
- tapOn: Oda kur
- extendedWaitUntil:
    visible: Odayı kur
    timeout: 10000
- tapOn: Mekana açık
- takeScreenshot: ${OUT_DIR}/13-new-room
- tapOn: Odayı kur
- extendedWaitUntil:
    visible: Tabu odası
    timeout: 15000
- takeScreenshot: ${OUT_DIR}/14-room-waiting
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: request-join
- extendedWaitUntil:
    visible: Katılma isteği
    timeout: 20000
- takeScreenshot: ${OUT_DIR}/15-join-request
- tapOn:
    id: join-accept
- extendedWaitUntil:
    visible: Oyunu başlat
    timeout: 15000
- takeScreenshot: ${OUT_DIR}/16-room-two-tables
- tapOn: Oyunu başlat
# Turn 1: the owner table (this phone) describes; its card starts covered.
- extendedWaitUntil:
    visible: Kartı görmek için dokun
    timeout: 20000
- takeScreenshot: ${OUT_DIR}/17-card-covered
- tapOn: Kartı görmek için dokun
- extendedWaitUntil:
    visible: Yasaklı kelimeler
    timeout: 20000
- takeScreenshot: ${OUT_DIR}/18-card-open
- tapOn: Pas · 3
- extendedWaitUntil:
    visible: Pas · 2
    timeout: 10000
# The judging table (the bot) says Doğru.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: mark
      BODY: '{"result":"correct"}'
- takeScreenshot: ${OUT_DIR}/19-after-marks
# Turn 2 without waiting 60 s: the bot table's turn, this phone judges.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: expire-turn
- extendedWaitUntil:
    visible: Tur 2/6
    timeout: 20000
- extendedWaitUntil:
    visible: Tabu −1
    timeout: 20000
- takeScreenshot: ${OUT_DIR}/20-judge
- tapOn: Doğru \+1
