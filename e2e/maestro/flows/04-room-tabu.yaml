# V7 and T1–T3: open Tabu room, the bot table asks to join, accept, one voice Tabu turn. First the
# spots: a room at another spot, "Bu noktadayım", then the same spot.
appId: app.kabuk.mobile
---
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: login
# The bot table checks in at another spot and opens a room there: the lobby groups it under its
# spot with "Bu noktadayım" instead of a request (docs/SPEC_V3.md §4.3).
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: checkin
      BODY: '{"spot":"kutuphane"}'
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: create-room
- tapOn:
    id: tab-venue
- extendedWaitUntil:
    visible:
      id: spot-here
    timeout: 20000
- assertVisible: Kütüphane
- assertNotVisible: Katılmak istiyorum
- takeScreenshot: 12b-lobby-other-spot
- tapOn:
    id: spot-here
- extendedWaitUntil:
    visible: Katılmak istiyorum
    timeout: 15000
- assertVisible: 'Noktan: Kütüphane'
- takeScreenshot: 12c-lobby-same-spot
# The bot closes its room; this phone opens one at the same spot and the bot asks to join it.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-room
- extendedWaitUntil:
    notVisible: Katılmak istiyorum
    timeout: 20000
- extendedWaitUntil:
    visible: Oda kur
    timeout: 10000
- tapOn: Oda kur
- extendedWaitUntil:
    visible: Odayı kur
    timeout: 10000
- tapOn: Mekana açık
- takeScreenshot: 13-new-room
- tapOn: Odayı kur
- extendedWaitUntil:
    visible: Tabu odası.*
    timeout: 15000
- takeScreenshot: 14-room-waiting
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: request-join
- extendedWaitUntil:
    visible: Katılma isteği
    timeout: 20000
- takeScreenshot: 15-join-request
- tapOn:
    id: join-accept
- extendedWaitUntil:
    visible: Oyunu başlat
    timeout: 15000
- takeScreenshot: 16-room-two-tables
- tapOn: Oyunu başlat
# Turn 1: the owner table (this phone) describes; its card starts covered.
- extendedWaitUntil:
    visible: Kartı görmek için dokun
    timeout: 20000
- takeScreenshot: 17-card-covered
- tapOn: Kartı görmek için dokun
- extendedWaitUntil:
    visible:
      id: tabu-card
    timeout: 20000
- takeScreenshot: 18-card-open
# The buttons are under the card; with a two-line room title they are below the fold.
- scrollUntilVisible:
    element:
      id: tabu-pass
    centerElement: true
    timeout: 10000
- assertVisible: 3 hak
- tapOn:
    id: tabu-pass
- scrollUntilVisible:
    element:
      text: 2 hak
    centerElement: true
    timeout: 10000
# The judging table (the bot) says Doğru.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: mark
      BODY: '{"result":"correct"}'
- takeScreenshot: 19-after-marks
# Turn 2 without waiting 60 s: the bot table's turn, this phone judges.
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: expire-turn
# The screen is scrolled down to the buttons; the turn counter is at the top.
- scrollUntilVisible:
    element:
      text: .*Tur 2/6
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element:
      id: tabu-taboo
    centerElement: true
    timeout: 20000
- takeScreenshot: 20-judge
- tapOn:
    id: tabu-correct
