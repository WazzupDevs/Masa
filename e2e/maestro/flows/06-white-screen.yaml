# V8: the bot table ends the room; this phone must move to "Tanışalım mı?" without a blank screen.
# Then "Masanla oyna": a private one-table room, its games started directly, "Odayı bitir" closes it.
appId: app.kabuk.mobile
---
- tapOn:
    id: tab-venue
- extendedWaitUntil:
    visible: Oda kur
    timeout: 10000
- tapOn: Oda kur
- extendedWaitUntil:
    visible:
      id: intent-none
    timeout: 10000
# The intent and participation choices push the button below the fold.
- scrollUntilVisible:
    element:
      text: Odayı kur
    timeout: 10000
- tapOn: Odayı kur
# A waiting room: the table can play on its own until another table joins.
- extendedWaitUntil:
    visible:
      id: solo-tabu
    timeout: 15000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: request-join
- extendedWaitUntil:
    visible: Katılma isteği
    timeout: 20000
- tapOn:
    id: join-accept
- extendedWaitUntil:
    visible:
      id: propose-tabu
    timeout: 15000
- tapOn:
    id: propose-tabu
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: answer-game
- extendedWaitUntil:
    visible: Kartı görmek için dokun
    timeout: 20000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: end-room
- extendedWaitUntil:
    visible: Tanışalım mı\?
    timeout: 20000
- assertNotVisible: Bir şeyler ters gitti
- takeScreenshot: 28-ended-by-bot
- tapOn:
    id: reveal-no
- extendedWaitUntil:
    visible: Güzel oyundu.*
    timeout: 15000
- runScript:
    file: ../scripts/bot.js
    env:
      ACTION: reveal
      BODY: '{"yes":false}'
- assertNotVisible: Bir şeyler ters gitti
- takeScreenshot: 29-good-game
- tapOn: Mekana dön
- extendedWaitUntil:
    visible: Oda kur
    timeout: 15000
- tapOn:
    id: play-with-table
- extendedWaitUntil:
    visible:
      id: solo-tabu
    timeout: 15000
- takeScreenshot: 29b-solo-room
- tapOn:
    id: solo-tabu
- extendedWaitUntil:
    visible: Takım . başlasın
    timeout: 15000
- takeScreenshot: 29c-solo-tabu
- scrollUntilVisible:
    element:
      id: end-game
    timeout: 10000
- tapOn:
    id: end-game
- scrollUntilVisible:
    element:
      id: solo-sohbet
    direction: UP
    timeout: 15000
- scrollUntilVisible:
    element:
      id: end-room
    timeout: 10000
- tapOn:
    id: end-room
- extendedWaitUntil:
    visible: Oda kur
    timeout: 15000
